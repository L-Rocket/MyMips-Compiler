name: Build and Release MyMips Toolchain

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version (example: v1.2.3)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-22.04

    steps:
      - name: Resolve release version
        id: version
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.release_version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi

          if ! echo "${VERSION}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$'; then
            echo "Invalid release version: ${VERSION}"
            echo "Expected format: vMAJOR.MINOR.PATCH (optional pre-release/build suffixes)"
            exit 1
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Ensure release tag exists for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if git rev-parse "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "Tag ${VERSION} already exists, reusing it."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${VERSION}" -m "Release ${VERSION}" "${GITHUB_SHA}"
            git push origin "refs/tags/${VERSION}"
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Configure
        run: |
          cmake -S llvm -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS=clang \
            -DLLVM_TARGETS_TO_BUILD=X86 \
            -DLLVM_EXPERIMENTAL_TARGETS_TO_BUILD=MyMips \
            -DLLVM_TOOL_LLVM_EXEGESIS_BUILD=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF

      - name: Build clang and llc
        run: |
          ninja -C build clang llc

      - name: Verify MyMips backend
        run: |
          build/bin/llc --version | grep -i MyMips

      - name: Package binaries
        run: |
          mkdir -p dist
          cp build/bin/clang dist/clang
          cp build/bin/llc dist/llc
          strip dist/clang dist/llc || true

          ARCHIVE="MyMips-Compiler-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz"
          tar -C dist -czf "${ARCHIVE}" clang llc
          sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"

      - name: Upload CI artifact
        uses: actions/upload-artifact@v7
        with:
          name: mymips-toolchain-${{ steps.version.outputs.version }}-linux-x86_64
          path: |
            MyMips-Compiler-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz
            MyMips-Compiler-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz.sha256

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: MyMips Compiler ${{ steps.version.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            MyMips-Compiler-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz
            MyMips-Compiler-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz.sha256
