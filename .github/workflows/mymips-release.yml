name: Build and Release MyMips Toolchain

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Configure
        run: |
          cmake -S llvm -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS=clang \
            -DLLVM_TARGETS_TO_BUILD=X86 \
            -DLLVM_EXPERIMENTAL_TARGETS_TO_BUILD=MyMips \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF

      - name: Build clang and llc
        run: |
          ninja -C build clang llc

      - name: Verify MyMips backend
        run: |
          build/bin/llc --version | grep -i MyMips

      - name: Package binaries
        run: |
          mkdir -p dist
          cp build/bin/clang dist/clang
          cp build/bin/llc dist/llc
          strip dist/clang dist/llc || true
          tar -C dist -czf "MyMips-Compiler-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" clang llc
          sha256sum "MyMips-Compiler-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" > "MyMips-Compiler-${GITHUB_REF_NAME}-linux-x86_64.tar.gz.sha256"

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: mymips-toolchain-${{ github.ref_name }}-linux-x86_64
          path: |
            MyMips-Compiler-${{ github.ref_name }}-linux-x86_64.tar.gz
            MyMips-Compiler-${{ github.ref_name }}-linux-x86_64.tar.gz.sha256

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            MyMips-Compiler-${{ github.ref_name }}-linux-x86_64.tar.gz
            MyMips-Compiler-${{ github.ref_name }}-linux-x86_64.tar.gz.sha256
